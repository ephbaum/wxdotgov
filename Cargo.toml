[package]
name = "wxdotgov"
version = "0.9.9"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
# `json` and `query` are both opt-in as of 0.13 -- `query` in particular used to
# be unconditional, and dropping it silently removes `.query()` from the API.
#
# Default features are deliberately left on. 0.13 defines `default-tls = rustls`,
# so the upgrade alone drops the OpenSSL dependency that 0.11's `native-tls`
# default pulled in; `default-features = false` would buy about three fewer
# compiled crates in exchange for losing HTTP/2, charset-aware body decoding,
# and system proxy settings on Windows and macOS. That is a bad trade for a CLI
# that end users install.
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0.196", features = ["derive"] }
tokio = { version = "1.35.1", features = ["rt-multi-thread", "macros"] }
serde_json = "1.0"

[dev-dependencies]
mockito = "1.2.0"

# Lints are declared here rather than through RUSTFLAGS in CI, so that a
# plain `cargo build` reproduces CI's denials locally instead of a
# contributor seeing warnings pass and only finding the failure in CI.
#
# It also keeps RUSTFLAGS unset. RUSTFLAGS participates in the build
# fingerprint, so setting it in CI alone splits those artifacts from local
# ones and forces a full rebuild whenever it is toggled.
#
# Note this is NOT what stops dependency warnings from failing the build --
# cargo already passes `--cap-lints allow` to registry dependencies, which
# holds even when RUSTFLAGS=-Dwarnings is set.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
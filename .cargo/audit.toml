# Configuration for `cargo audit` (also read by rustsec/audit-check in CI).

[advisories]
ignore = [
    # rustls-pemfile is unmaintained. It reaches us transitively through
    # reqwest 0.11 and cannot be resolved by a lockfile bump -- it needs the
    # reqwest 0.12+/rustls migration tracked in #31. There is no patched
    # version to move to, so leaving this unignored would hold the audit job
    # red indefinitely for an advisory we already track and cannot action here.
    # Remove this entry as part of #31.
    "RUSTSEC-2025-0134",
]

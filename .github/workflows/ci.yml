name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # The audit job is the supply-chain gate and there is deliberately no ignore
  # list, but that guarantee only holds if something runs it. On push/PR alone,
  # an advisory published during a quiet week goes unnoticed. The weekly run
  # also exercises the rest of the suite against whatever `stable` has become,
  # so toolchain drift surfaces on a schedule rather than on a contributor's PR.
  schedule:
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always
  # Warnings are denied via the [lints] table in Cargo.toml, not RUSTFLAGS, so
  # local `cargo build` and CI enforce exactly the same set. See #32.

# Cancel superseded runs on the same ref (a new push to a PR obsoletes the old run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Run tests
        run: cargo test --verbose

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Denials come from [lints] in Cargo.toml, so no -D flags are needed here.
      - name: Run clippy
        run: cargo clippy --all-targets

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned to the `rust-version` declared in Cargo.toml. When a dependency
      # bump raises the real floor, this job fails and the declared value gets
      # corrected -- otherwise `rust-version` silently becomes a claim nobody
      # checks.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check against the declared MSRV
        run: cargo check --all-targets --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit dependencies for RUSTSEC advisories
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
